name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test

  # The action itself, as a workflow uses it: a real OIDC token from GitHub,
  # exchanged at a stand-in for kubelatch on this runner. Pull requests from
  # forks get no id-token permission, so they skip it.
  self-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: start the stand-in for kubelatch
        run: |
          node tools/fake-kubelatch.js "$RUNNER_TEMP/port" &
          for _ in $(seq 1 50); do [ -s "$RUNNER_TEMP/port" ] && break; sleep 0.1; done
          echo "KUBELATCH_URL=http://127.0.0.1:$(cat "$RUNNER_TEMP/port")" >> "$GITHUB_ENV"
      - id: kubelatch
        uses: ./
        with:
          url: ${{ env.KUBELATCH_URL }}/
      - name: the kubeconfig and the outputs are there
        env:
          KUBECONFIG_OUT: ${{ steps.kubelatch.outputs.kubeconfig }}
          EXPIRES_AT: ${{ steps.kubelatch.outputs.expires-at }}
          CLUSTERS: ${{ steps.kubelatch.outputs.clusters }}
        run: |
          set -eu
          test "$KUBECONFIG" = "$KUBECONFIG_OUT"
          test "$(stat -c %a "$KUBECONFIG")" = 600
          grep -q 'current-context: self-test' "$KUBECONFIG"
          test "$CLUSTERS" = '["self-test"]'
          date -d "$EXPIRES_AT" > /dev/null
          kubectl config current-context
